services:
  printmax:
    build: .
    image: printmax:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RETENTION_DAYS: "7"
      POLL_INTERVAL_MS: "3000"
      CAPS_REFRESH_HOURS: "24"
      MAX_UPLOAD_MB: "200"
      DEFAULT_MEDIA: iso_a4_210x297mm
    volumes:
      - data:/data
      - uploads:/data/uploads
    # DNS-SD discovery needs multicast, which the default bridge network blocks.
    # To use "Scan" from inside Docker, replace `ports:` with host networking:
    # network_mode: host

volumes:
  data:
  uploads:
