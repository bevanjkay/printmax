name: Actionlint

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: "actionlint-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  actionlint:
    # Synced verbatim to every repository in the sync matrix. The checks live in
    # the hub's reusable workflow; a change there reaches the matrix only after
    # the hub is tagged and this pin is bumped, which the sync then propagates.
    permissions:
      contents: read
      security-events: write # SARIF upload, skipped on private repositories
    uses: bevanjkay/.github/.github/workflows/reusable-actionlint.yml@3e72e076e6c2392168263e84970716a7012902ac # v2026.09.14

  conclusion:
    # The required check. Calling a reusable workflow names its jobs
    # "actionlint / <job>", so requiring them directly would break every ruleset
    # the moment a job inside the hub workflow is renamed. This name never moves.
    needs: actionlint
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Result
        env:
          RESULT: ${{ needs.actionlint.result }}
        run: |
          [[ "${RESULT}" == success ]]
