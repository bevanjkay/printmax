version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /**/*
    schedule:
      interval: monthly
      time: !!str 08:00
      timezone: Australia/Melbourne
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is the native compiler line. Hold every repository on 6.x
      # until it has been migrated by hand.
      - dependency-name: typescript
        versions:
          - ">=7"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - .github/workflows/actionlint.yml
    schedule:
      interval: monthly
      time: !!str 08:00
      timezone: Australia/Melbourne
    groups:
      gh-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /
      - /**/*
    schedule:
      interval: monthly
      time: !!str 08:00
      timezone: Australia/Melbourne
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directories:
      - /
      - /**/*
    schedule:
      interval: monthly
      time: !!str 08:00
      timezone: Australia/Melbourne
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directories:
      - /
      - /**/*
    schedule:
      interval: monthly
      time: !!str 08:00
      timezone: Australia/Melbourne
    groups:
      pip-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
